[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcl-itr"
version = "0.2.0"
description = "Causal, temporal, auditable runtime ledger utilities for long-horizon and multi-agent AI systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
ctcl-itr-topology = "ctcl_itr.topology:_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
