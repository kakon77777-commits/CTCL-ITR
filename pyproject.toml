[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcl-itr"
version = "0.2.13"
description = "Causal, temporal, auditable runtime ledger utilities for long-horizon and multi-agent AI systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
ctcl-itr-topology = "ctcl_itr.topology:_main"
ctcl-itr-cloudevents = "ctcl_itr.interop.cloudevents:_main"
ctcl-itr-otel = "ctcl_itr.interop.opentelemetry:_main"
ctcl-itr-integrity = "ctcl_itr.integrity:_main"
ctcl-itr-governance-demo = "ctcl_itr.governance:_main"
ctcl-itr-governance-store = "ctcl_itr.governance_store:_main"
ctcl-itr-governance-metrics = "ctcl_itr.governance_metrics:_main"
ctcl-itr-governance-signals = "ctcl_itr.governance_signals:_main"
ctcl-itr-horizon-calibrate = "ctcl_itr.horizon_calibration:_main"
ctcl-itr-calibration-robustness = "ctcl_itr.calibration_robustness:_main"
ctcl-itr-calibration-uncertainty = "ctcl_itr.calibration_uncertainty:_main"
ctcl-itr-mixture-sensitivity = "ctcl_itr.calibration_mixture_sensitivity:_main"
ctcl-itr-joint-surface = "ctcl_itr.calibration_joint_surface:_main"
ctcl-itr-surface-geometry = "ctcl_itr.calibration_surface_geometry:_main"
ctcl-itr-geometry-drift = "ctcl_itr.calibration_geometry_drift:_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
