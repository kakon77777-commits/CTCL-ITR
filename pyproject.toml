[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcl-itr"
version = "0.2.6"
description = "Causal, temporal, auditable runtime ledger utilities for long-horizon and multi-agent AI systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ctcl-itr-topology = "ctcl_itr.topology:_main"
ctcl-itr-cloudevents = "ctcl_itr.interop.cloudevents:_main"
ctcl-itr-otel = "ctcl_itr.interop.opentelemetry:_main"
ctcl-itr-integrity = "ctcl_itr.integrity:_main"
ctcl-itr-governance-demo = "ctcl_itr.governance:_main"
ctcl-itr-governance-store = "ctcl_itr.governance_store:_main"
ctcl-itr-governance-metrics = "ctcl_itr.governance_metrics:_main"
ctcl-itr-governance-signals = "ctcl_itr.governance_signals:_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
